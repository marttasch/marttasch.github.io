<div class="language-switcher">
  {% assign current_lang = page.lang | default: site.default_language %}
  <div class="lang-container">
    {% if page.collection == "projects" %}
      <!-- Project page URL handling -->
      {% if current_lang == "en" %}
        <a href="/project{{ page.url | remove: '-de' }}" 
           class="lang-option active" 
           aria-label="Switch to English">
          <span class="lang-code">EN</span>
          <span class="lang-name">English</span>
        </a>
        <div class="lang-divider"></div>
        <a href="/project{{ page.url | remove: '.html' }}-de.html" 
           class="lang-option" 
           aria-label="Zu Deutsch wechseln">
          <span class="lang-code">DE</span>
          <span class="lang-name">Deutsch</span>
        </a>
      {% else %}
        <a href="/project{{ page.url | remove: '-de' }}" 
           class="lang-option" 
           aria-label="Switch to English">
          <span class="lang-code">EN</span>
          <span class="lang-name">English</span>
        </a>
        <div class="lang-divider"></div>
        <a href="{{ page.url }}" 
           class="lang-option active" 
           aria-label="Zu Deutsch wechseln">
          <span class="lang-code">DE</span>
          <span class="lang-name">Deutsch</span>
        </a>
      {% endif %}
    {% else %}
      <!-- Regular page URL handling -->
      <a href="/en{{ page.url | remove: '/de' }}" 
         class="lang-option {% if current_lang == 'en' %}active{% endif %}" 
         aria-label="Switch to English">
        <span class="lang-code">EN</span>
        <span class="lang-name">English</span>
      </a>
      <div class="lang-divider"></div>
      <a href="/de{{ page.url | remove: '/en' }}" 
         class="lang-option {% if current_lang == 'de' %}active{% endif %}" 
         aria-label="Zu Deutsch wechseln">
        <span class="lang-code">DE</span>
        <span class="lang-name">Deutsch</span>
      </a>
    {% endif %}
  </div>
</div>

<style>
  .language-switcher {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 0rem;
  }

  .lang-container {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(221, 177, 18, 0.3);
    border-radius: 50px;
    padding: 0.5rem;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
  }


  .lang-option {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.3rem 0.6rem;
    border-radius: 40px;
    transition: all 0.3s ease;
    color: rgba(255, 255, 255, 0.6);
    text-decoration: none;
    cursor: pointer;
    font-weight: 500;
    font-size: 0.9rem;
  }

  .lang-option:hover {
  }

  .lang-option.active {
    background: linear-gradient(135deg, #ddb112 0%, #f0c040 100%);
    color: #000;
    font-weight: 600;
  }

  .lang-option.active .lang-code {
    font-weight: 700;
  }

  .lang-code {
    font-size: 1rem;
    font-weight: 600;
  }

  .lang-name {
    display: none;
    font-size: 0.75rem;
  }

  .lang-divider {
    width: 1px;
    height: 1.5rem;
    background: rgba(221, 177, 18, 0.2);
  }

  @media (max-width: 768px) {
    .lang-container {
      padding: 0.4rem;
      gap: 0.3rem;
    }

    .lang-option {
      padding: 0.5rem 1rem;
    }

    .lang-code {
      font-size: 0.95rem;
    }
  }

  @media (max-width: 576px) {
    .lang-container {
      gap: 0.2rem;
    }

    .lang-option {
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
    }

    .lang-code {
      font-size: 0.9rem;
    }

    .lang-divider {
      height: 1.2rem;
    }
  }
</style>
