{% if site.data[page.lang | default: site.default_language].info.aboutMe_enabled %}
<section id="about" class="about">
    <div class="container">
        <div class="row">
            <div class="col-lg-12" id="aboutMe-container">
                <h2>{% if page.lang == "de" %}Über mich{% else %}About Me{% endif %}</h2>
                <p>
                    {{ site.data[page.lang | default: site.default_language].info.aboutMe_text  }}
                </p>
            </div>
        </div>
    </div>
</section>
{% endif %}
