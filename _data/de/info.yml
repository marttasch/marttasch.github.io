aboutMe_text: >
  Ich bin ein Technologe, fasziniert davon, wie KI echte Probleme lösen und neue 
  Möglichkeiten erschließen kann. Mein Fokus liegt auf Computer Vision und generative 
  Modelle, Bereiche, die ich durch meine Bachelorarbeit erkundet habe.
  Mein Hintergrund in interaktiven Medien und eingebetteten Systemen hat mir praktisches, 
  interdisziplinäres und ergebnisorientiertes Denken beigebracht. Ich löse gerne innovative 
  technische Herausforderungen, besonders wenn ich technische Tiefe mit kreativen Anwendungen verbinde.
  Ich verpflichte mich zu Open-Source-Software, weil ich glaube, dass die beste Technologie 
  aus transparenten, kollaborativen Ansätzen entsteht.

