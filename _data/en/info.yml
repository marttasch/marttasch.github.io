aboutMe_text: >
 I combine technical depth with creative execution: as a B.Sc. in Media Technology with a focus on interactive media and computer vision, I work where analogue and digital worlds meet. My path from event technician to media engineer has shaped my practical, interdisciplinary and solution-oriented thinking.
 I see artificial intelligence as a tool that must be used in an innovative, responsible and purpose-driven way. Open-source principles and digital sovereignty are central to me in this: transparency, collaboration and control over one's own data create the foundation for technology with genuine societal value.

