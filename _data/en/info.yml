aboutMe_text: >
  I combine technical depth with creative applications, driven by the conviction that AI must be used not only innovatively, but also responsibly and purposefully.
  My background in interactive media and embedded systems has taught me practical, interdisciplinary, and solution-oriented thinking. As a B.Sc. in Media Technology with a focus on generative AI and computer vision, I am committed to sustainable, future-proof solutions.
  Open-source principles and digital sovereignty are central to my approach: transparency, collaboration, and control over one’s own data are what lay the foundation for technology that creates genuine social value.

