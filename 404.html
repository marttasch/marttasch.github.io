---
permalink: /404.html
layout: default
---

<style type="text/css" media="screen">
  .container {
    margin: 10px auto;
    max-width: 600px;
    text-align: center;
  }
  h1 {
    margin: 30px 0;
    font-size: 4em;
    line-height: 1;
    letter-spacing: -1px;
  }
</style>

<div class="container">
  {% assign lang = page.lang | default: site.default_language %}
  <h1>404</h1>

  {% if lang == "de" %}
    <p><strong>Seite nicht gefunden :(</strong></p>
    <p>Die angeforderte Seite konnte nicht gefunden werden.</p>
  {% else %}
    <p><strong>Page not found :(</strong></p>
    <p>The requested page could not be found.</p>
  {% endif %}
</div>
